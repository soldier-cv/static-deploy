# Woodpecker CI - static-deploy 原型分发服务（Woodpecker v3）
# 触发策略（仅 tag + manual，日常 push 不触发）
# 形态：nginx + python 双容器，server/ 为 bind mount（改代码 restart 即生效，无需重建镜像）
# 链路：同步代码到宿主 -> compose restart -> 健康验证 -> 18 项 MCP 自测
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

skip_clone: false

steps:
  - name: resolve-tag
    image: alpine:3.20
    commands:
      - >-
        if [ -n "$${CI_COMMIT_TAG}" ]; then echo "$${CI_COMMIT_TAG}"; elif [ -n "$${deploy_tag:-}" ]; then echo "$${deploy_tag}"; elif [ -n "$${DEPLOY_TAG:-}" ]; then echo "$${DEPLOY_TAG}"; else echo latest; fi | tr -d ' ' > /tmp/release_tag
      - echo "RELEASE_TAG=$$(cat /tmp/release_tag) (static-deploy 为 bind-mount 容器，无镜像产物)"

  - name: sync-and-restart
    image: docker:26
    volumes:
      - /opt/code/static-deploy:/opt/code/static-deploy
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # 同步代码（server/ 是 bind mount，restart 即生效）
      - cp -rf server tools client-mcp mcp /opt/code/static-deploy/ || true
      - cd /opt/code/static-deploy
      # restart 重读 bind mount 的代码（env 未变；改 env 需手动 up -d）
      - docker compose -f server/docker-compose.yml --env-file server/.env restart
      - docker compose -f server/docker-compose.yml --env-file server/.env ps
      # 健康验证：busybox wget --spider 退出码 0=可达；看板必须通，MCP 端点通不通都记录（无协商头 400 属正常）
      - >-
        for i in $$(seq 1 20); do if wget -q -O /dev/null --spider http://127.0.0.1:8088/; then echo "deploy OK: web reachable (attempt $$i)"; exit 0; fi; echo "waiting ($$i)"; sleep 5; done; echo "health check failed" >&2; exit 1

  - name: selftest
    image: python:3.12-slim
    volumes:
      - /opt/code/static-deploy:/opt/code/static-deploy
    commands:
      # 18 项 MCP 自测（裸 JSON-RPC 标准库实现，无需 SDK；须去代理变量）
      - cd /opt/code/static-deploy
      - env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY python3 tools/selftest_mcp.py http://127.0.0.1:8088
