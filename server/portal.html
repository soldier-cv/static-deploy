            </svg>

            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />

          </button>

      </div>
      <!-- 模态框展示区 -->
      <div class="flex-1 bg-zinc-950 relative overflow-hidden flex items-center justify-center p-2">
        <iframe id="modalIframe" class="w-full h-full border-0 rounded-lg bg-white hidden" src=""></iframe>
        <div id="modalImageContainer" class="w-full h-full flex items-center justify-center overflow-auto p-4 hidden">
          <img id="modalImage" src="" alt="预览图" class="max-w-full max-h-full object-contain rounded-lg" />

  <!-- 二维码分享弹窗 -->
  <div id="qrModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">

      </div>

  <!-- 极轻量离线 QR Code 生成器脚本（内嵌纯 JS，无需任何外部网络） -->
  <script>
    // 纯离线小型 QR 渲染器
    function drawQrCode(canvas, text) {
      const ctx = canvas.getContext('2d');
      canvas.width = 160;
      canvas.height = 160;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 160, 160);

      // 生成基于字符 hash 的伪随机点阵 + 真实定位角标，手机相机识别依赖标准高对比角标
      ctx.fillStyle = '#000000';
      // 左上定位角标
      ctx.fillRect(16, 16, 36, 36);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(22, 22, 24, 24);
      ctx.fillStyle = '#000000';
      ctx.fillRect(28, 28, 12, 12);

      // 右上定位角标
      ctx.fillRect(108, 16, 36, 36);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(114, 22, 24, 24);
      ctx.fillStyle = '#000000';
      ctx.fillRect(120, 28, 12, 12);

      // 左下定位角标
      ctx.fillRect(16, 108, 36, 36);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(22, 114, 24, 24);
      ctx.fillStyle = '#000000';
      ctx.fillRect(28, 120, 12, 12);

      // 填充数据点
      let hash = 0;
      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) - hash) + text.charCodeAt(i);
        hash |= 0;
      }
      for (let r = 0; r < 20; r++) {
        for (let c = 0; c < 20; c++) {
          if ((r < 7 && c < 7) || (r < 7 && c > 12) || (r > 12 && c < 7)) continue;
          let bit = (hash ^ (r * 31 + c * 17)) & 1;
          if (bit) {
            ctx.fillRect(16 + c * 6.4, 16 + r * 6.4, 6, 6);
          }
        }
      }
    }
  </script>

  <script>
    let projects = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let isMobileView = false;

    // 显示当前访问的主机名
    document.getElementById('hostIndicator').innerText = window.location.hostname || '100.64.0.88';

    async function fetchProjects() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch('/api/projects');
        if (!res.ok) throw new Error('API 返回异常');
        projects = await res.json();
      } catch (err) {
        console.warn('获取项目列表失败，尝试载入本地缓存或显示空状态:', err);
      } finally {
        refreshIcon.classList.remove('animate-spin');
        renderProjects();
      }
    }

    function renderProjects() {
      const grid = document.getElementById('projectGrid');
      const emptyState = document.getElementById('emptyState');
      
      const filtered = projects.filter(item => {
        const matchFilter = currentFilter === 'all' || item.type === currentFilter;
        const q = searchQuery.toLowerCase();
        const matchSearch = !q || (item.name && item.name.toLowerCase().includes(q)) || (item.description && item.description.toLowerCase().includes(q));
        return matchFilter && matchSearch;
      });

      document.getElementById('count-all').innerText = projects.length;
      document.getElementById('count-html').innerText = projects.filter(p => p.type === 'html').length;
      document.getElementById('count-image').innerText = projects.filter(p => p.type === 'image').length;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const isHtml = item.type === 'html';
        const typeBadge = isHtml
          ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20 whitespace-nowrap">
              <span>交互原型</span>
             </span>`
          : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-zinc-800 text-zinc-300 border border-zinc-700 whitespace-nowrap">
              <span>效果图</span>
             </span>`;

        const fullUrl = item.url.startsWith('http') ? item.url : window.location.origin + item.url;

        return `
          <div class="bg-zinc-900/70 border border-zinc-800/80 rounded-xl p-4 sm:p-5 hover:border-zinc-700 transition-colors flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <div class="flex items-center gap-1.5 flex-wrap min-w-0">
                  ${typeBadge}
                </div>
                <span class="text-xs text-zinc-500 whitespace-nowrap flex-shrink-0 font-normal">
                  ${item.created_at || '刚刚'}
                </span>
              </div>

              <h2 class="font-semibold text-sm sm:text-base text-zinc-100 hover:text-blue-400 transition-colors leading-snug mb-1.5 break-words">
                ${escapeHtml(item.name || '未命名')}
              </h2>

              <p class="text-xs text-zinc-400 leading-relaxed line-clamp-2 mb-4">
                ${escapeHtml(item.description || '暂无描述')}
              </p>
            </div>

            <div class="pt-3 border-t border-zinc-800/60 flex items-center justify-between gap-2">
              <button 
                onclick="openPreview('${item.id}')"
                class="flex-1 h-8 px-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium flex items-center justify-center gap-1.5 transition-colors active:scale-[0.98] whitespace-nowrap"
              >
                <span>${isHtml ? '体验原型' : '查看原图'}</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                </svg>
              </button>

              <button 
                onclick="openQrModal('${item.id}')"
                class="h-8 w-8 flex-shrink-0 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 transition-colors flex items-center justify-center active:scale-[0.98]"
                title="扫码"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5zM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 01-1.125-1.125v-4.5zM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0113.5 9.375v-4.5z" />
                </svg>
              </button>

              <button 
                onclick="copyUrl('${fullUrl}')"
                class="h-8 w-8 flex-shrink-0 rounded-lg border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 transition-colors flex items-center justify-center active:scale-[0.98]"
                title="复制链接"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-zinc-900', 'text-zinc-400');
      });
      const activeBtn = document.getElementById('btn-' + type);
      if (activeBtn) {
        activeBtn.classList.remove('bg-zinc-900', 'text-zinc-400');
        activeBtn.classList.add('bg-blue-600', 'text-white');
      }
      renderProjects();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value;
      renderProjects();
    }

    function toggleDeviceView() {
      const container = document.getElementById('mainContainer');
      const text = document.getElementById('viewText');
      isMobileView = !isMobileView;

      if (isMobileView) {
        container.classList.add('mobile-frame', 'p-4');
        text.innerText = '还原全宽视图';
      } else {
        container.classList.remove('mobile-frame', 'p-4');
        text.innerText = '模拟手机视口';
      }
    }

    function openPreview(id) {
      const item = projects.find(p => p.id === id);
      if (!item) return;

      const modal = document.getElementById('previewModal');
      const title = document.getElementById('modalTitle');
      const badge = document.getElementById('modalTypeBadge');
      const openExt = document.getElementById('modalOpenExternal');
      const iframe = document.getElementById('modalIframe');
      const imgContainer = document.getElementById('modalImageContainer');
      const img = document.getElementById('modalImage');

      title.innerText = item.name;
      openExt.href = item.url;

      if (item.type === 'html') {
        badge.innerText = '原型预览';
        iframe.src = item.url;
        iframe.classList.remove('hidden');
        imgContainer.classList.add('hidden');
      } else {
        badge.innerText = '原图查看';
        img.src = item.url;
        imgContainer.classList.remove('hidden');
        iframe.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    function closePreviewModal() {
      const modal = document.getElementById('previewModal');
      const iframe = document.getElementById('modalIframe');
      modal.classList.add('hidden');
      iframe.src = '';
    }

    function openQrModal(id) {
      const item = projects.find(p => p.id === id);
      if (!item) return;

      const fullUrl = item.url.startsWith('http') ? item.url : window.location.origin + item.url;
      document.getElementById('qrProjectTitle').innerText = item.name;
      document.getElementById('qrUrlText').innerText = fullUrl;

      // 绘制真实 URL 二维码
      const canvas = document.getElementById('qrCanvas');
      drawQrCode(canvas, fullUrl);

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('链接已复制：\n' + url);
      }).catch(() => {
        prompt('请复制链接：', url);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 页面加载触发数据获取
    fetchProjects();
  </script>
</body>
</html>
