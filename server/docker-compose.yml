services:
  # 1. 静态分发与网关（Nginx Alpine）
  web:
    image: nginx:1.31.8-alpine
    container_name: static-deploy-web
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:80"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal.html:/usr/share/nginx/html/index.html:ro
      - ${DATA_DIR:-/data/static-deploy}/sites:/data/sites:ro
      - ${DATA_DIR:-/data/static-deploy}/res:/data/res:ro
      - ../mcp:/usr/share/nginx/html/docs:ro
      - ../client-mcp:/usr/share/nginx/html/client:ro
      - ../skills:/srv/skills:ro
      # resource-mgr 技能真源在项目仓库里，../skills/resource-mgr 是指向它的符号链接；
      # 容器内必须能解析到同一个绝对路径，否则 nginx 读不到文件（404）。
      # 挂仓库根而不是 skills/resource-mgr：git 操作（rebase/checkout）会删掉并重建
      # 这个目录，绑定到子目录的 mount 会指向已删除的 inode，表现为容器里目录为空。
      - /opt/code/resource-mgr:/opt/code/resource-mgr:ro
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # 2. 部署接收与解压服务（Python 3 Alpine，0 外部依赖）
  api:
    image: python:3.12-alpine
    container_name: static-deploy-api
    restart: unless-stopped
    command: python3 -u /app/receiver.py
    volumes:
      - ./receiver.py:/app/receiver.py:ro
      - ${DATA_DIR:-/data/static-deploy}:/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      - DATA_DIR=/data
      - API_TOKEN=${API_TOKEN:-}
      - PORT=8089
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
