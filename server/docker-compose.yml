version: "3.8"

services:
  # 1. 静态分发与网关（Nginx Alpine，内存仅 ~8MB）
  web:
    image: nginx:alpine
    container_name: static-preview-web
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal.html:/usr/share/nginx/html/index.html:ro
      - ${DATA_DIR:-/data/static-preview}/sites:/data/sites:ro
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # 2. 部署接收与解压服务（Python 3 Alpine，内存仅 ~18MB，0 外部依赖）
  api:
    image: python:3.12-alpine
    container_name: static-preview-api
    restart: unless-stopped
    command: python3 -u /app/receiver.py
    volumes:
      - ./receiver.py:/app/receiver.py:ro
      - ${DATA_DIR:-/data/static-preview}:/data
    environment:
      - DATA_DIR=/data
      - API_TOKEN=${API_TOKEN:-lan-static-preview-token-2026}
      - PORT=8089
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
