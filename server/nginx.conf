server {
    listen 80;
    server_name localhost;

    # 允许上传最大 100MB 的原型打包文件或大图
    # 略高于 Python 侧 100MB，以便超限请求落到 API 返回 JSON 413 而不是 nginx HTML
    client_max_body_size 110M;

    # 开启 gzip 压缩加速传输
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 首页：展示中心看板
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }

    # 静态原型与图片资源分发（高性能直发）
    location /sites/ {
        alias /data/sites/;
        autoindex off;
        charset utf-8;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, no-transform";
    }

    # MCP 远程端点（精确匹配，禁止与 /docs/ 重叠；SSE 关闭缓冲）
    location = /mcp {
        proxy_pass http://api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # MCP 接入文档（托管仓库 mcp/ 目录）
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    # 历史 MCP 文档临时重定向至目标项目自身托管地址
    location = /docs/image-gallery.md {
        return 302 http://100.64.0.88:30898/docs/mcp-setup.md;
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index README.md;
        default_type text/markdown;
        charset utf-8;
        autoindex off;
    }

    # 客户端 MCP 脚本下载（托管仓库 client-mcp/）
    location /client/ {
        alias /usr/share/nginx/html/client/;
        default_type text/plain;
        charset utf-8;
        autoindex off;
    }

    # API 接口代理至 Python 轻量接收程序
    location /api/ {
        proxy_pass http://api:8089;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲保证流式上传平稳
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
