server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # 允许上传最大 100MB 的原型打包文件或大图
    # 略高于 Python 侧 100MB，以便超限请求落到 API 返回 JSON 413 而不是 nginx HTML
    client_max_body_size 110M;

    # 开启 gzip 压缩加速传输
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 首页：展示中心看板
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }

    # 静态原型与图片资源分发（高性能直发）
    location /sites/ {
        alias /data/sites/;
        autoindex off;
        charset utf-8;
        expires 7d;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, no-transform";
    }

    # 静态资源分发包（宿主 res 只读挂到 /data/res，nginx 直发，不经 API）
    # 目录枚举必须在 location 上直接 404：autoindex off 只关列表页，
    # 目录 URI 仍会 301 到带斜杠的索引，或在后续配置变化时露出文件名。
    # 用 root /data 让 URI /res/... 原样对应磁盘 /data/res/...。
    # 不用 alias：正则 location 里 alias 会把整段 URI 换掉，捕获组替换不稳定。
    location = /res { return 404; }
    location = /res/ { return 404; }
    location ~ ^/res/.+/$ { return 404; }
    location ~ ^/res/(?:manifest\.json|[A-Za-z0-9][A-Za-z0-9._-]*/(?:[A-Za-z0-9][A-Za-z0-9._-]*\.(?:md|txt|json|zip|sha256|gz|ps1|sh|exe)|VERSION))$ {
        root /data;
        charset utf-8;
        default_type text/plain;
        types {
            text/markdown md;
            text/plain txt sha256 ps1 sh;
            application/json json;
            application/zip zip;
            application/gzip gz;
            application/octet-stream exe;
        }
        add_header X-Content-Type-Options nosniff;
    }
    location /res/ { return 404; }

    # MCP 远程端点（精确匹配，禁止与 /docs/ 重叠；SSE 关闭缓冲）
    location = /mcp {
        proxy_pass http://api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # MCP 接入指引（全生态统一挂 /setup）
    location = /setup {
        alias /usr/share/nginx/html/docs/static-deploy.md;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }

    location = /setup/ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        rewrite ^ /setup last;
    }

    # 历史老链接 302 临时重定向
    location = /docs/image-gallery.md {
        return 302 http://100.64.0.88:30898/setup;
    }

    location = /docs/static-deploy.md {
        return 302 /setup;
    }

    location = /docs/README.md {
        return 302 /setup;
    }

    location = /docs/ {
        return 302 /setup;
    }

    location = /docs {
        return 302 /setup;
    }

    # 客户端 MCP 脚本下载（托管仓库 client-mcp/）
    location /client/ {
        alias /usr/share/nginx/html/client/;
        default_type text/plain;
        charset utf-8;
        autoindex off;
    }

    # Agent 技能分发包（只放行白名单文件，禁止目录枚举）
    # 源目录挂在 /srv/skills（**站点根之外**）——挂进 /usr/share/nginx/html 下会被
    # server 级 root 之类的后续改动意外暴露成第二条可达路径，故不给它留根内位置。
    location = /.well-known/skills { return 404; }
    location = /.well-known/skills/ { return 404; }
    location = /.well-known/skills/static-deploy-mcp/ { return 404; }
    location ~ ^/\.well-known/skills/(?<s>[a-z][a-z0-9_-]*)/(?<f>SKILL\.md|references/[A-Za-z0-9][A-Za-z0-9_-]*\.md)$ {
        alias /srv/skills/$s/$f;
        default_type text/plain;
        charset utf-8;
    }
    location = /.well-known/skills/index.json {
        alias /srv/skills/index.json;
        default_type application/json;
    }
    location /.well-known/skills/ { return 404; }

    # API 接口代理至 Python 轻量接收程序
    location /api/ {
        proxy_pass http://api:8089;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲保证流式上传平稳
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
