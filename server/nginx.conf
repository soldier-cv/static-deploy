server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    # 允许上传最大 100MB 的原型打包文件或大图
    # 略高于 Python 侧 100MB，以便超限请求落到 API 返回 JSON 413 而不是 nginx HTML
    client_max_body_size 110M;

    # 开启 gzip 压缩加速传输
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/markdown application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 首页：展示中心看板
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        try_files /index.html =404;
    }

    # 浏览器会直接请求 /favicon.ico。容器只挂了本配置文件，没有单独的图标挂载，
    # 因此这里直接返回与 server/favicon.svg 相同的 SVG，避免落到默认 404 HTML。
    # types 置空，避免按 .ico 后缀发成 image/x-icon。
    set $sd_favicon "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\"><rect width=\"24\" height=\"24\" rx=\"5\" fill=\"#18181b\"/><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.6\" fill=\"#3b82f6\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.6\" fill=\"#3b82f6\" opacity=\"0.45\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.6\" fill=\"#3b82f6\" opacity=\"0.45\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.6\" fill=\"#3b82f6\"/></svg>";

    location = /favicon.ico {
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
        return 200 $sd_favicon;
    }

    location = /favicon.svg {
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
        return 200 $sd_favicon;
    }

    # 快照 URL /sites/<slug>/versions/<n>/ 内容不可变，可以长期缓存。
    # 正则 location 优先于下面的前缀 location。用 root 而不是 alias，避免正则里 alias 把整段 URI 换掉。
    location ~ ^/sites/[A-Za-z0-9_-]+/versions/[0-9]+/ {
        root /data;
        autoindex off;
        charset utf-8;
        # 一条 Cache-Control。expires 会再写一条 max-age，两条叠在一起时只读第一条的客户端会丢掉 public。
        add_header Cache-Control "public, max-age=2592000, no-transform";
        default_type text/plain;
        charset_types text/markdown text/plain;
        types {
            text/markdown md markdown;
            text/plain    txt;
            text/html     html htm;
            application/json json;
        }
        add_header Access-Control-Allow-Origin *;
    }

    # 静态原型与图片资源分发（高性能直发）
    # 稳定 project 的主链接会覆盖写，不能再缓存 7 天，否则手机一直看到旧页面。
    location /sites/ {
        alias /data/sites/;
        autoindex off;
        charset utf-8;
        expires off;
        # Markdown/纯文本按文本类型直发（否则 .md 落到 octet-stream，浏览器不渲染、agent 难判定）
        default_type text/plain;
        charset_types text/markdown text/plain;
        types {
            text/markdown md markdown;
            text/plain    txt;
            text/html     html htm;
            application/json json;
        }
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "no-cache";
    }

    # 静态资源分发包（宿主 res 只读挂到 /data/res，nginx 直发，不经 API）
    # 目录枚举必须在 location 上直接 404：autoindex off 只关列表页，
    # 目录 URI 仍会 301 到带斜杠的索引，或在后续配置变化时露出文件名。
    # 用 root /data 让 URI /res/... 原样对应磁盘 /data/res/...。
    # 不用 alias：正则 location 里 alias 会把整段 URI 换掉，捕获组替换不稳定。
    location = /res { return 404; }
    location = /res/ { return 404; }
    location ~ ^/res/.+/$ { return 404; }
    location ~ ^/res/(?:manifest\.json|[A-Za-z0-9][A-Za-z0-9._-]*/(?:[A-Za-z0-9][A-Za-z0-9._-]*\.(?:md|txt|json|zip|sha256|gz|ps1|sh|exe)|VERSION))$ {
        root /data;
        charset utf-8;
        # charset 只给 charset_types 里的类型追加 ; charset=。
        # 默认集合有 text/plain，没有 text/markdown 与 application/json。
        charset_types text/markdown text/plain application/json;
        default_type text/plain;
        types {
            text/markdown md;
            text/plain txt sha256 ps1 sh;
            application/json json;
            application/zip zip;
            application/gzip gz;
            application/octet-stream exe;
        }
        add_header X-Content-Type-Options nosniff;
    }
    location /res/ { return 404; }

    # MCP 远程端点（精确匹配，禁止与 /docs/ 重叠；SSE 关闭缓冲）
    location = /mcp {
        proxy_pass http://api:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # MCP 接入指引（全生态统一挂 /setup）
    location = /setup {
        alias /usr/share/nginx/html/docs/static-deploy.md;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }

    location = /setup/ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        rewrite ^ /setup last;
    }

    # 历史老链接 302 临时重定向
    location = /docs/image-gallery.md {
        return 302 http://100.64.0.88:30898/setup;
    }

    location = /docs/static-deploy.md {
        return 302 /setup;
    }

    location = /docs/README.md {
        return 302 /setup;
    }

    location = /docs/ {
        return 302 /setup;
    }

    location = /docs {
        return 302 /setup;
    }

    # 客户端 MCP 脚本下载（托管仓库 client-mcp/）
    location /client/ {
        alias /usr/share/nginx/html/client/;
        default_type text/plain;
        charset utf-8;
        autoindex off;
    }

    # Agent 技能分发包（只放行白名单文件，禁止目录枚举）
    # 源目录挂在 /srv/skills（**站点根之外**）——挂进 /usr/share/nginx/html 下会被
    # server 级 root 之类的后续改动意外暴露成第二条可达路径，故不给它留根内位置。
    location = /.well-known/skills { return 404; }
    location = /.well-known/skills/ { return 404; }
    location = /.well-known/skills/static-deploy-mcp/ { return 404; }
    location ~ ^/\.well-known/skills/(?<s>[a-z][a-z0-9_-]*)/(?<f>SKILL\.md|(?:references|scripts|assets|templates)/(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9_.-]*\.(?:md|py|sh|js|ps1|yaml|yml|json|txt|toml|bat|cmd))$ {
        alias /srv/skills/$s/$f;
        charset utf-8;
        charset_types text/markdown text/plain text/x-script text/javascript application/json text/yaml;
        default_type text/plain;
        types {
            text/markdown   md;
            text/x-script   py sh;
            text/javascript js;
            application/json json;
            text/yaml       yaml yml;
            text/plain      ps1 txt toml bat cmd;
        }
    }
    location = /.well-known/skills/index.json {
        alias /srv/skills/index.json;
        default_type application/json;
    }
    # 技能注册表通用客户端（skillctl）：单文件，任意硬件 curl 下载即用
    location = /.well-known/skillctl.py {
        alias /srv/skills-client/skillctl.py;
        default_type text/x-python;
    }
    location /.well-known/skills/ { return 404; }

    # API 接口代理至 Python 轻量接收程序
    location /api/ {
        proxy_pass http://api:8089;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲保证流式上传平稳
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
